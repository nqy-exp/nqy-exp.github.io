<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIU | FAQ</title>
    <!-- 引入全局CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
    
    <style>
        :root {
            --primary-color: #e67e22;
            --bg-color: #fffdfa;
        }

body, html {
    margin: 0; 
    padding: 0;
    width: 100%; 
    /* 不要写 height: 100% 了，除非你确定页面内容绝对不会超过一屏 */
    min-height: 100%; 
    background-color: var(--bg-color);
    font-family: sans-serif;
    /* 【关键修改】允许滚动，否则你看不到页脚 */
    overflow-x: hidden; /* 防止横向晃动 */
    overflow-y: auto;   /* 允许纵向滚动 */
}

        /* =========================================
           1. Header (仅品牌)
           ========================================= */
        .portal-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            display: flex; justify-content: center; align-items: center;
            z-index: 3000; border-bottom: 1px solid #eee;
        }

        .ni-brand-center {
            font-weight: bold; font-size: 1.8em; color: #333;
            text-decoration: none !important; position: relative;
            display: inline-block; padding-bottom: 4px; transition: color 0.3s ease;
        }

        .ni-brand-center::after {
            content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 2px;            
        background-color: #e67e22; 
        transform: scaleX(0);   
        transform-origin: center; 
        transition: transform 0.3s ease;
        pointer-events: none; 
        }
        .ni-brand-center:hover::after { transform: scaleX(1); }

.construction-sticky {
    /* 1. 定位到屏幕正中心 */
    position: fixed; 
    top: 50%;
    left: 50%;
    
    /* 2. 使用 transform 实现真正的几何中心对齐 */
    /* 注意：这里的 translate 会被下面的 animation 覆盖，所以必须写在 keyframes 里 */
    transform: translate(-50%, -50%); 

    padding: 12px 20px;
    background-color: #fffde7;
    border-left: 4px solid #fbc02d;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1); /* 加深阴影，让它看起来更有悬浮感 */
    display: flex; 
    align-items: center; 
    gap: 10px;
    border-radius: 4px;
    z-index: 9999; /* 确保它在最顶层 */

    /* 3. 绑定动画 */
    animation: floatCenter 3s ease-in-out infinite;
}

/* 4. 【核心】专门为居中设计的漂浮动画 */
@keyframes floatCenter {
    0%, 100% {
        /* 必须同时包含 translate(-50%, -50%)，否则居中会失效 */
        transform: translate(-50%, -50%);
    }
    50% {
        /* 在保持居中的基础上，向上偏移 15px 实现漂浮感 */
        transform: translate(-50%, -60%);
    }
}


        .note-icon { font-size: 1.2em; }
        .note-text { font-size: 0.85em; color: #7d6608; line-height: 1.4; }

         </style>
</head>
<body>

       <header class="portal-header">
        <a href="https://github.com/nqy-exp/Numbered-Image-Utility" 
           target="_blank" rel="noopener noreferrer" class="ni-brand-center">
            NIU
        </a>
    </header>
 <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
      <!-- 正在施工的便利贴 (Construction Note) -->
    <div class="construction-sticky">
        <span class="note-icon">🚧</span>
        <div class="note-text">
            <div style="font-weight: bold; font-size: 0.9em;">建设中 / Under Construction</div>
            <div style="font-size: 0.8em; opacity: 0.8;">更多功能正在路上...</div>
        </div>
    </div>

</main>

    <!-- 页脚：它会随着页面滚动出现在最底部 -->
    {% include footer.html %}
</body>
</html>
