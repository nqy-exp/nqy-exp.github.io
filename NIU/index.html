<style>
/* =========================================
   1. 核心变量与基础设置
   ========================================= */
:root {
    --niu-primary: #e67e22;
    --niu-text-main: #333;
    --niu-text-sub: #888;
    --niu-text-faq: #444; /* FAQ 使用更稳重的深灰色 */
    --niu-bg: #fffdfa;
}

/* =========================================
   2. 四角悬浮导航 (Corner Navigation)
   ========================================= */
.niu-corner-nav-container {
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100vh;
    pointer-events: none; 
    z-index: 2000;
}

.niu-corner-nav-container * {
    pointer-events: auto;
}

/* 【核心入口】超大标题 */
.niu-corner-title {
    font-weight: 900; 
    font-size: 4.5em; 
    color: var(--niu-text-main);
    text-decoration: none !important;
    display: inline-block;
    position: relative;
    padding-bottom: 12px; /* 增加间距感 */
    line-height: 1;
    transition: color 0.3s ease;
}

/* --- 动态渐变线基类 --- */
.niu-corner-title::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 4px; 
    transform: scaleX(0.7); /* 通过 hover 触发生长 */
    transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

/* 【右上角 User Guide 特殊逻辑】
   右边实，左边淡。移动时从右向左单侧伸长。
*/
.niu-group-top-right .niu-corner-title::after {
    right: 0; /* 对齐右侧 */
    background: linear-gradient(to left, var(--niu-primary), rgba(230, 126, 34, 0));
    transform-origin: right; /* 从右侧生长 */
}

.niu-group-top-right .niu-corner-title:hover::after {
    transform: scaleX(1.2); /* 向左伸长 */
}

/* 【左下角 说明书 特殊逻辑】
   左边实，右边淡。移动时从左向右单侧伸长。
*/
.niu-group-bottom-left .niu-corner-title::after {
    left: 0; /* 对齐左侧 */
    background: linear-gradient(to right, var(--niu-primary), rgba(230, 126, 34, 0));
    transform-origin: left; /* 从左侧生长 */
}

.niu-group-bottom-left .niu-corner-title:hover::after {
    transform: scaleX(1.2); /* 向右伸长 */
}

/* 右上角组: User Guide (English) */
.niu-group-top-right {
    position: absolute; 
    top: 70px; 
    right: 50px; 
    text-align: right;
}

/* 增加英文标题与下方列表的呼吸感 */
.niu-group-top-right .niu-corner-list {
    margin-top: 35px; 
}

/* 左下角组: 说明书 (中文) */
.niu-group-bottom-left {
    position: absolute; 
    bottom: 150px; 
    left: 50px; 
    text-align: left;
}

/* 【核心修正】增加中文列表与下方标题之间的间隔，让它更舒展 */
.niu-group-bottom-left .niu-corner-list {
    margin-bottom: 40px; 
    flex-direction: column-reverse; 
}

/* 列表样式 */
.niu-corner-list {
    list-style: none; 
    padding: 0; 
    margin: 0;
    display: flex; 
    flex-direction: column;
}

.niu-corner-item {
    font-size: 1em; 
    color: var(--niu-text-sub); 
    text-decoration: none;
    display: block; 
    padding: 5px 0;
    transition: all 0.3s ease;
}

.niu-corner-item:hover {
    color: var(--niu-primary);
    transform: scale(1.1);
}

/* 悬停偏移 */
.niu-group-top-right .niu-corner-item:hover { transform: translateX(-10px); }
.niu-group-bottom-left .niu-corner-item:hover { transform: translateY(-5px); }


/* =========================================
   3. 中心 Hero (FAQ) - 视觉降级优化
   ========================================= */
.niu-portal-hero {
    min-height: 100vh; 
    display: flex; 
    flex-direction: column;
    justify-content: center; 
    align-items: center; 
    text-align: center;
}

/* FAQ 现在颜色更深，不再是“半透明感”，而是“优雅的灰色” */
.niu-faq-giant-link {
    font-size: 2.5em; 
    font-weight: 700; 
    color: var(--niu-text-faq); 
    text-decoration: none; 
    transition: all 0.4s ease;
}

.niu-faq-giant-link:hover {
    color: var(--niu-primary);
    letter-spacing: 5px;
}

.niu-faq-subtitle {
    margin-top: 15px; 
    font-size: 0.8em; 
    color: #ddd; 
    letter-spacing: 6px; 
    text-transform: uppercase;
}


/* =========================================
   4. 其他组件 (便签 & 个人链接)
   ========================================= */

/* 建设中便利贴 */
.niu-construction-sticky {
    position: fixed; 
    bottom: 100px; 
    right: 40px; 
    padding: 12px 20px;
    background-color: #fffde7;
    border-left: 4px solid #fbc02d;
    box-shadow: 3px 3px 15px rgba(0,0,0,0.08);
    display: flex; 
    align-items: center; 
    gap: 10px;
    border-radius: 4px;
    z-index: 9999;
    animation: niu-float 3s ease-in-out infinite;
}

@keyframes niu-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.niu-note-icon { font-size: 1.2em; }
.niu-note-text { font-size: 0.85em; color: #7d6608; line-height: 1.4; }

/* 底部个人网站入口 */
.niu-personal-footer-wrapper {
    padding: 20px 0 50px 0; 
    text-align: center;
}

.niu-personal-link {
    text-decoration: none; 
    color: #ccc; 
    font-size: 0.75em; 
    transition: color 0.3s ease;
}

.niu-personal-link:hover { 
    color: var(--niu-primary); 
}


/* =========================================
   5. 响应式适配
   ========================================= */
@media (max-width: 768px) {
    .niu-group-top-right, .niu-group-bottom-left { 
        position: relative; 
        top: 0; right: 0; bottom: 0; left: 0;
        text-align: center; 
        padding: 40px 20px; 
    }
    .niu-group-top-right .niu-corner-list,
    .niu-group-bottom-left .niu-corner-list {
        margin-top: 20px;
        margin-bottom: 20px;
    }
    .niu-corner-title { font-size: 3em; }
    .niu-faq-giant-link { font-size: 2em; }
    .niu-construction-sticky { position: relative; bottom: 0; right: 0; margin: 20px auto; }
}
</style>

    <div class="niu-group-bottom-left">
