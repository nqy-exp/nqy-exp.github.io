<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIU | Entry</title>
<!-- 引入全局CSS -->
<link rel="stylesheet" href="/assets/css/style.css">
<style>
:root {
--primary-color: #e67e22;
--bg-color: #fffdfa;
        }

/* 【修正】允许滚动，并确保高度至少为一屏 */
body, html {
margin: 0; padding: 0;
width: 100%; 
min-height: 100vh; 
background-color: var(--bg-color);
font-family: sans-serif;
overflow-x: hidden; 
overflow-y: auto; /* 允许纵向滚动 */
}

/* =========================================
           1. Header (仅品牌)
           ========================================= */
.portal-header {
position: fixed; top: 0; left: 0; width: 100%; height: 80px;
display: flex; justify-content: center; align-items: center;
z-index: 3000; border-bottom: 1px solid #eee;
        }

.ni-brand-center {
font-weight: bold; font-size: 1.8em; color: #333;
text-decoration: none !important; position: relative;
display: inline-block; padding-bottom: 4px; transition: color 0.3s ease;
        }

.ni-brand-center::after {
content: "";
position: absolute; left: 0; bottom: 0; width: 100%; height: 2px;            
background-color: #e67e22; 
transform: scaleX(0);   
transform-origin: center; 
transition: transform 0.3s ease;
pointer-events: none; 
        }
.ni-brand-center:hover::after { transform: scaleX(1); }

/* =========================================
           2. 四角悬浮导航 (Corner Navigation)
           ========================================= */
.corner-nav-container {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
pointer-events: none; z-index: 2000;
        }

.corner-nav-container a, .corner-nav-container div { pointer-events: auto; }

/* 右上角: User Guide */
.top-right-group {
position: absolute; top: 40px; right: 40px; text-align: right;
        }

/* 左下角: 说明书 */
.bottom-left-group {
position: absolute; bottom: 100px; left: 40px; text-align: left;
        }

.corner-title {
font-weight: bold; font-size: 1.2em; color: #333;
display: block; margin-bottom: 15px;
        }

.corner-list {
list-style: none; padding: 0; margin: 0;
display: flex; flex-direction: column;
        }

/* 【关键】左下角反向逻辑 */
.bottom-left-group .corner-list {
flex-direction: column-reverse; 
        }

.corner-item {
font-size: 0.9em; color: #888; text-decoration: none;
display: block; padding: 4px 12px; transition: all 0.3s ease;
        }

.corner-item:hover { color: var(--primary-color); }

.top-right-group .corner-item:hover { transform: translateX(-5px); }
.bottom-left-group .corner-item:hover { transform: translateX(5px); }

/* =========================================
           3. 中心 Hero (FAQ)
           ========================================= */
.portal-hero {
/* 【修正】使用 min-height 而不是 height，确保它至少占一屏，但可以被内容撑开 */
min-height: 100vh; 
display: flex; flex-direction: column;
justify-content: center; align-items: center; text-align: center;
        }

.faq-giant-link {
font-size: 4em; font-weight: 900; color: #333;
text-decoration: none; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

.faq-giant-link:hover {
color: var(--primary-color);
letter-spacing: 8px;
        }

.faq-subtitle {
margin-top: 10px; font-size: 0.8em; color: #bbb; letter-spacing: 6px; text-transform: uppercase;
        }

/* =========================================
           4. 正在施工的便利贴 (Construction Note)
           ========================================= */
.construction-sticky {
position: fixed; bottom: 100px; right: 40px; 
padding: 12px 20px;
background-color: #fffde7;
border-left: 4px solid #fbc02d;
box-shadow: 3px 3px 10px rgba(0,0,0,0.05);
display: flex; align-items: center; gap: 10px;
border-radius: 4px;
z-index: 9999;
animation: float 3s ease-in-out infinite;
        }

@keyframes float {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-10px); }
}

.note-icon { font-size: 1.2em; }
.note-text { font-size: 0.85em; color: #7d6608; line-height: 1.4; }

/* =========================================
           5. 其他组件
           ========================================= */
.personal-footer-link {
position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
text-decoration: none; color: #bbb; font-size: 0.8em; transition: all 0.3s ease;
}
.personal-footer-link:hover { color: var(--primary-color); }

@media (max-width: 768px) {
.top-right-group, .bottom-left-group { position: static; text-align: center; padding: 20px; }
.portal-hero { padding-top: 80px; }
.faq-giant-link { font-size: 3em; }
}
</style>
</head>
<body id="body">

<!-- Header -->
<header class="portal-header">
<a href="https://github.com/nqy-exp/Numbered-Image-Utility" 
target="_blank" rel="noopener noreferrer" class="ni-brand-center">
            NIU
</a>
</header>

<!-- 四角悬浮导航 -->
<div class="corner-nav-container">
    <!-- 右上角: User Guide -->
    <div class="top-right-group">
        <span class="corner-title">
            <a href="/en/index" style="text-decoration: none; color: inherit;">User Guide</a>
        </span>
        <div class="corner-list">
            <a href="/en/index#section1" class="corner-item">Getting Started</a>
            <a href="/en/index#section2" class="corner-item">Advanced Features</a>
            <a href="/en/index#section3" class="corner-item">...</a>
        </div>
    </div>

    <!-- 左下角: 说明书 -->
    <div class="bottom-left-group">
        <div class="corner-list">
            <a href="/zh/index#section4" class="corner-item">章节 4</a>
            <a href="/zh/index#section3" class="corner-item">章节 3</a>
            <a href="/zh/index#section2" class="corner-item">章节 2</a>
            <a href="/zh/index#section1" class="corner-item">章节 1</a>
        </div>

        <span class="corner-title">
            <a href="/zh/index" style="text-decoration: none; color: inherit;">说明书</a>
        </span>
    </div>
</div>

<!-- 中心 Hero -->
<main class="portal-hero">
    <a href="/faq/index" class="faq-giant-link">FAQ</a>
    <p class="faq-subtitle">Frequently Asked Questions</p>
</main>

<!-- 正在施工的便利贴 -->
<div class="construction-sticky">
    <span class="note-icon">🚧</span>
    <div class="note-text">
        <div style="font-weight: bold; font-size: 0.9em;">建设中 / Under Construction</div>
        <div style="font-size: 0.8em; opacity: 0.8;">更多功能正在路上...</div>
    </div>
</div>

<!-- 底部个人网站入口 -->
<a href="https://your-personal-website.com" target="_blank" rel="noopener noreferrer" class="personal-footer-link">
        欢迎造访我的个人网站 / Welcome to my personal website
</a>

<!-- 原有页脚 -->
    {% include footer.html %}

</body>
</html>
