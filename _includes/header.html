<!-- header.html -->
<header class="my-custom-header">
   
  <!-- 1. 汉堡按钮 (必须包含三个 span 用于制作 X 动画) -->
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- 2. 【移动端专属】Header 里的快速导航 (仅在主页/无侧边栏页面显示) -->
  <nav class="mobile-quick-nav" id="mobileQuickNav">
    <ul class="quick-links-list">
      <li><a href="/about/" class="quick-link">About Me</a></li>
      <li><a href="/projects/" class="quick-link">Experimental Logs</a></li>
      <li><a href="/ideas/" class="quick-link">Jibber-Jabber</a></li>
    </ul>
  </nav>

  <!-- 3. 标题 -->
<!-- 3. 【已集成 Logo 的标题单元】 -->
  <div class="header-left">
    <!-- 将 Logo 和 文字 包裹在一个 brand 链接中 -->
    <a href="/" class="header-brand">
      <img src="/images/favicon-180x180.png" alt="Logo" class="header-logo">
      <span class="header-title">QY Niu's Log</span>
    </a>
  </div>

  <!-- 4. 桌面端导航 (保持不变) -->
  <nav class="desktop-nav">
    <ul class="nav-menu">
      <li><a href="/about/">About Me</a></li>
      <li><a href="/projects/">Experimental Logs</a></li>
      <li><a href="/ideas/">Jibber-Jabber</a></li>
    </ul>
  </nav>
</header>
